name: CI

on:
  push:
    branches: [main, 'copilot/**', 'feat/**']
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: apps/player-pwa

jobs:
  api-type-check:
    name: API Type Check (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root workspaces)
        working-directory: .
        run: npm ci

      - name: Type check API
        working-directory: apps/api
        run: npx tsc --noEmit

  api-test:
    name: API Unit Tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root workspaces)
        working-directory: .
        run: npm ci

      - name: Run API tests
        working-directory: apps/api
        run: npm test

  lint-type-check:
    name: PWA Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root workspaces)
        working-directory: .
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root workspaces)
        working-directory: .
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Turborepo Build (api + pwa)
    runs-on: ubuntu-latest
    needs: [api-type-check, api-test, lint-type-check, test]
    env:
      NEXT_PUBLIC_API_URL: https://api.koralink.sa
      NEXT_PUBLIC_MAPBOX_TOKEN: pk.placeholder
      NEXT_PUBLIC_MOYASAR_KEY: pk.placeholder
      NEXT_PUBLIC_APP_URL: https://app.koralink.sa
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root workspaces)
        working-directory: .
        run: npm ci

      - name: Turborepo build
        working-directory: .
        run: npx turbo run build
