# PR review first-pass (pr-review-automation spec, slice S1).
# LLM review is advisory; deterministic security lives in semgrep.yml.
#
# Why the Docker CLI (not qodo-ai/pr-agent@main):
#   - @main drifted: it ran /describe, its action.yml dropped the `commands` input (2026-09-23 PR #28).
#   - Repo .pr_agent.toml is read from the DEFAULT branch (main = release-only, no toml there)
#     → config must come from env. Documented precedence: env (PR_AGENT__SECTION__KEY) wins.
# Image: codiumai/pr-agent:latest (Docker Hub; fresh 2026-04-16 build — the version tags there are stale).
# Backend: z.ai glm-5.3-flash via LiteLLM "openai/<model>" + OPENAI.API_BASE (existing Lite key).

name: PR Agent (z.ai GLM review)

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: PR-Agent /review (Docker CLI)
        run: |
          docker run --rm \
            -e PR_AGENT__CONFIG__MODEL=openai/glm-5.3-flash \
            -e PR_AGENT__CONFIG__FALLBACK_MODELS="" \
            -e PR_AGENT__OPENAI__KEY="$ZAI_KEY" \
            -e PR_AGENT__OPENAI__API_BASE="$ZAI_BASE" \
            -e OPENAI.KEY="$ZAI_KEY" \
            -e OPENAI.API_BASE="$ZAI_BASE" \
            -e OPENAI_API_KEY="$ZAI_KEY" \
            -e OPENAI_API_BASE="$ZAI_BASE" \
            -e CONFIG__MODEL=openai/glm-5.3-flash \
            -e GITHUB_TOKEN="$GH_PAT" \
            codiumai/pr-agent:latest \
            --pr_url="$PR_URL" review
        env:
          ZAI_KEY: ${{ secrets.ZAI_PR_REVIEW_KEY }}
          ZAI_BASE: https://api.z.ai/api/coding/paas/v4
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
