# PR review first-pass (pr-review-automation spec, slice S1).
# LLM review is advisory; deterministic security lives in semgrep.yml.
# Backend: z.ai glm-5.3-flash on the existing Lite plan key (owner decision 2026-09-23:
# reuse ZAI_API_KEY value, stored as ZAI_PR_REVIEW_KEY repo secret).

name: PR Agent (z.ai GLM review)

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PR-Agent /review
        uses: qodo-ai/pr-agent@main
        env:
          OPENAI_API_KEY: ${{ secrets.ZAI_PR_REVIEW_KEY }}
          OPENAI_API_BASE: https://api.z.ai/api/coding/paas/v4
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commands: /review
