services:
  # ── PostgreSQL 16 + PostGIS ───────────────────────────────────────────────
  postgres:
    image: imresamu/postgis:16-3.5
    container_name: koralink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: koralink
      POSTGRES_PASSWORD: koralink_dev
      POSTGRES_DB: koralink
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/drizzle/gist_indexes.sql:/docker-entrypoint-initdb.d/01_gist_indexes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koralink -d koralink"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
